<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Painel Admin - Controle de Colhedoras</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=10">
    <link rel="stylesheet" href="auth.css?v=10">
</head>

<body>
    <div class="auth-loading-overlay" id="auth-loading">
        <div class="auth-loading-overlay__spinner"></div>
        <span>Verificando acesso...</span>
    </div>

    <div class="app-container" id="admin-container" style="display:none;">
        <header class="app-header">
            <div class="header-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
                </svg>
            </div>
            <div class="header-text">
                <h1>Painel Admin</h1>
                <p class="header-subtitle">Usuários cadastrados</p>
            </div>
            <div class="user-bar">
                <span class="user-bar__name" id="user-name-label"></span>
                <a href="index.html" class="user-bar__btn" aria-label="App">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
                    <span class="user-bar__label">App</span>
                </a>
                <button type="button" class="user-bar__btn" id="btn-logout" aria-label="Sair">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                    <span class="user-bar__label">Sair</span>
                </button>
            </div>
        </header>

        <div class="admin-page">
            <p class="auth-error" id="admin-error" role="alert"></p>

            <div id="admin-ajuda-banner" hidden style="background:#fff4e5;border:1px solid #f0b95c;border-radius:var(--radius-md,10px);padding:14px 16px;margin-bottom:16px;">
                <strong style="display:block;margin-bottom:8px;color:#8a5a00;">⚠️ Pessoas que não conseguiram confirmar o e-mail</strong>
                <div id="admin-ajuda-lista"></div>
            </div>

            <div class="admin-table-wrap">
                <table class="admin-table" id="admin-table">
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th>E-mail</th>
                            <th>Cadastrado em</th>
                            <th>Plano</th>
                            <th>Função</th>
                            <th>Ação</th>
                        </tr>
                    </thead>
                    <tbody id="admin-table-body"></tbody>
                </table>
                <div class="admin-empty" id="admin-empty" hidden>Nenhum usuário cadastrado ainda.</div>
            </div>
        </div>

        <div class="toast" id="toast">
            <span class="toast__message" id="toast-message"></span>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="api-config.js"></script>
    <script src="auth.js"></script>
    <script>
        (function () {
            'use strict';

            const overlay = document.getElementById('auth-loading');
            const container = document.getElementById('admin-container');
            const tbody = document.getElementById('admin-table-body');
            const emptyMsg = document.getElementById('admin-empty');
            const errorBox = document.getElementById('admin-error');
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toast-message');
            let toastTimeout = null;
            let meUid = null;

            function showToast(msg) {
                if (toastTimeout) clearTimeout(toastTimeout);
                toastMessage.textContent = msg;
                toast.className = 'toast toast--visible';
                toastTimeout = setTimeout(function () { toast.className = 'toast'; }, 2500);
            }

            function formatarData(ts) {
                if (!ts || !ts.toDate) return '—';
                try {
                    return ts.toDate().toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' });
                } catch (e) { return '—'; }
            }

            // --- Classifica o plano do usuário em um badge (trial/pix/cartão/etc) ---
            function classificarPlano(u) {
                const plan = u.plan || 'none';
                const status = u.planStatus || '';

                if (plan === 'trial') {
                    const dias = AppAuth.diasRestantesTeste(u);
                    return {
                        classe: 'trial',
                        label: 'Teste grátis',
                        sub: dias > 0 ? (dias + (dias === 1 ? ' dia restante' : ' dias restantes')) : 'expirado'
                    };
                }

                if (plan === 'premium' && status === 'pix') {
                    const fim = u.planExpiraEm ? formatarData(u.planExpiraEm) : '—';
                    return { classe: 'pix', label: 'Pix', sub: 'expira em ' + fim };
                }

                if (plan === 'premium') {
                    return { classe: 'cartao', label: 'Cartão', sub: 'assinatura recorrente' };
                }

                if (status === 'pending' || status === 'pix_pendente') {
                    return { classe: 'pendente', label: 'Pendente', sub: status === 'pix_pendente' ? 'aguardando Pix' : 'aguardando cartão' };
                }

                if (status === 'cancelled' || status === 'expirado') {
                    return { classe: 'cancelado', label: status === 'expirado' ? 'Expirado' : 'Cancelado', sub: '' };
                }

                return { classe: 'sem-plano', label: 'Sem plano', sub: '' };
            }

            function renderUsuarios(snapshot) {
                tbody.innerHTML = '';
                if (snapshot.empty) {
                    emptyMsg.hidden = false;
                    return;
                }
                emptyMsg.hidden = true;

                snapshot.forEach(function (doc) {
                    const u = doc.data();
                    const uid = doc.id;
                    const isSelf = uid === meUid;
                    // Admin não paga assinatura, então a coluna de status de
                    // pagamento (teste/pix/cartão/pendente) só faz sentido
                    // pros usuários normais.
                    const planoInfo = u.role === 'admin' ? null : classificarPlano(u);
                    const tr = document.createElement('tr');
                    tr.innerHTML =
                        '<td>' + (u.name || '—') + (isSelf ? ' <span style="color:var(--color-text-secondary);font-size:12px;">(você)</span>' : '') + '</td>' +
                        '<td>' + (u.email || '—') + '</td>' +
                        '<td>' + formatarData(u.createdAt) + '</td>' +
                        '<td>' + (planoInfo
                            ? '<span class="admin-plan-badge admin-plan-badge--' + planoInfo.classe + '">' + planoInfo.label + '</span>' +
                              (planoInfo.sub ? '<span class="admin-plan-sub">' + planoInfo.sub + '</span>' : '')
                            : '<span style="color:var(--color-text-secondary);">—</span>') + '</td>' +
                        '<td><span class="admin-role-badge admin-role-badge--' + (u.role === 'admin' ? 'admin' : 'user') + '">' + (u.role === 'admin' ? 'Admin' : 'Usuário') + '</span></td>' +
                        '<td></td>';

                    const tdAcao = tr.lastElementChild;
                    if (!isSelf) {
                        const btnRole = document.createElement('button');
                        btnRole.type = 'button';
                        btnRole.className = 'btn btn--secondary';
                        btnRole.style.padding = '4px 10px';
                        btnRole.style.fontSize = '12px';
                        btnRole.style.marginRight = '6px';
                        btnRole.textContent = u.role === 'admin' ? 'Remover admin' : 'Tornar admin';
                        btnRole.addEventListener('click', function () {
                            alternarRole(uid, u.role === 'admin' ? 'user' : 'admin');
                        });
                        tdAcao.appendChild(btnRole);

                        const btnVerificar = document.createElement('button');
                        btnVerificar.type = 'button';
                        btnVerificar.className = 'btn btn--secondary';
                        btnVerificar.style.padding = '4px 10px';
                        btnVerificar.style.fontSize = '12px';
                        btnVerificar.style.marginRight = '6px';
                        // Só mostra o botão pra quem realmente ainda não confirmou o
                        // e-mail. Quem já clicou no link não precisa e não deve
                        // aparecer aqui (emailVerified é sincronizado pelo auth.js
                        // assim que o app percebe que a pessoa confirmou).
                        const precisaConfirmar = u.exigeVerificacaoEmail && !u.emailVerified;
                        if (precisaConfirmar) {
                            btnVerificar.title = 'Use quando o link de confirmação por e-mail não funcionar no aparelho da pessoa (ex.: iPhone)';
                            btnVerificar.textContent = 'Confirmar e-mail';
                            btnVerificar.addEventListener('click', function () {
                                verificarEmailManualmente(uid, btnVerificar);
                            });
                            tdAcao.appendChild(btnVerificar);
                        }

                        const btnExcluir = document.createElement('button');
                        btnExcluir.type = 'button';
                        btnExcluir.className = 'btn btn--danger';
                        btnExcluir.style.padding = '4px 10px';
                        btnExcluir.style.fontSize = '12px';
                        btnExcluir.textContent = 'Excluir conta';
                        btnExcluir.addEventListener('click', function () {
                            confirmarExclusao(uid, u.name || u.email || 'este usuário');
                        });
                        tdAcao.appendChild(btnExcluir);
                    }
                    tbody.appendChild(tr);
                });
            }

            function alternarRole(uid, novoRole) {
                AppAuth.db.collection('users').doc(uid).update({ role: novoRole })
                    .then(function () {
                        showToast('Função atualizada com sucesso!');
                    })
                    .catch(function (err) {
                        console.error(err);
                        showToast('Erro ao atualizar função.');
                    });
            }

            // --- Diálogo de confirmação (mesmo visual usado no app) ---
            function showConfirmDialog(title, message, onConfirm) {
                const existing = document.querySelector('.confirm-overlay');
                if (existing) existing.remove();

                const overlay = document.createElement('div');
                overlay.className = 'confirm-overlay';
                overlay.innerHTML =
                    '<div class="confirm-dialog">' +
                        '<div class="confirm-dialog__icon">' +
                            '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
                                '<path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>' +
                                '<line x1="12" y1="9" x2="12" y2="13"/>' +
                                '<line x1="12" y1="17" x2="12.01" y2="17"/>' +
                            '</svg>' +
                        '</div>' +
                        '<h3 class="confirm-dialog__title">' + title + '</h3>' +
                        '<p class="confirm-dialog__message">' + message + '</p>' +
                        '<div class="confirm-dialog__actions">' +
                            '<button type="button" class="btn btn--secondary" id="confirm-cancel">Cancelar</button>' +
                            '<button type="button" class="btn btn--danger-solid" id="confirm-ok">Excluir</button>' +
                        '</div>' +
                    '</div>';

                document.body.appendChild(overlay);

                function closeDialog() { overlay.remove(); }

                document.getElementById('confirm-cancel').addEventListener('click', closeDialog);
                overlay.addEventListener('click', function (e) {
                    if (e.target === overlay) closeDialog();
                });
                document.getElementById('confirm-ok').addEventListener('click', function () {
                    closeDialog();
                    onConfirm();
                });
            }

            // --- Pede confirmação e chama a API que exclui o usuário de vez
            // (login no Firebase Auth + perfil + dados salvos no Firestore) ---
            function confirmarExclusao(uid, nomeOuEmail) {
                showConfirmDialog(
                    'Excluir conta',
                    'Tem certeza que deseja excluir a conta de "' + nomeOuEmail + '"? O login e todos os dados salvos dessa pessoa serão apagados. Essa ação não pode ser desfeita.',
                    function () { excluirUsuario(uid); }
                );
            }

            // --- Confirma o e-mail de quem não conseguiu clicar no link
            // (ex.: link não abre em alguns iPhones). Não precisa de
            // confirmação: é uma ação segura e pode ser refeita sem problema. ---
            function verificarEmailManualmente(uid, botao) {
                botao.disabled = true;
                AppAuth.chamarApi('verificarEmailManualmente', { uid: uid })
                    .then(function () {
                        showToast('E-mail confirmado! A pessoa já pode entrar no app.');
                    })
                    .catch(function (err) {
                        console.error(err);
                        showToast(err.message || 'Erro ao confirmar o e-mail.');
                    })
                    .then(function () {
                        botao.disabled = false;
                    });
            }

            // --- Pedidos de ajuda de quem clicou em "Não consegui confirmar o
            // e-mail" (tela verificar-email.html). Fica escutando em tempo
            // real: assim que alguém pede, o banner aparece sozinho aqui,
            // sem precisar recarregar a página. ---
            const ajudaBanner = document.getElementById('admin-ajuda-banner');
            const ajudaLista = document.getElementById('admin-ajuda-lista');
            let ultimaQtdPedidos = 0;

            function tempoAtras(timestamp) {
                if (!timestamp || !timestamp.toDate) return '';
                const ms = Date.now() - timestamp.toDate().getTime();
                const min = Math.floor(ms / 60000);
                if (min < 1) return 'agora mesmo';
                if (min < 60) return 'há ' + min + (min === 1 ? ' minuto' : ' minutos');
                const h = Math.floor(min / 60);
                return 'há ' + h + (h === 1 ? ' hora' : ' horas');
            }

            function renderAjuda(snapshot) {
                if (snapshot.empty) {
                    ajudaBanner.hidden = true;
                    ultimaQtdPedidos = 0;
                    return;
                }
                ajudaBanner.hidden = false;

                // Avisa com uma notificação do navegador quando chega um pedido novo
                // (só funciona se o admin já tiver autorizado notificações).
                if (snapshot.size > ultimaQtdPedidos && ultimaQtdPedidos !== 0 && window.Notification && Notification.permission === 'granted') {
                    const novo = snapshot.docs[0].data();
                    new Notification('Pedido de ajuda com verificação', {
                        body: (novo.name || novo.email || 'Um usuário') + ' não conseguiu confirmar o e-mail.'
                    });
                }
                ultimaQtdPedidos = snapshot.size;

                ajudaLista.innerHTML = '';
                snapshot.forEach(function (doc) {
                    const p = doc.data();
                    const uid = doc.id;
                    const linha = document.createElement('div');
                    linha.style.cssText = 'display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid #f0d9a8;';
                    linha.innerHTML =
                        '<span style="color:#5a4200;font-size:14px;">' +
                            '<strong>' + (p.name || '—') + '</strong> · ' + (p.email || '—') +
                            ' <span style="color:#8a5a00cc;font-size:12px;">(' + tempoAtras(p.criadoEm) + ')</span>' +
                        '</span>';
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.className = 'btn btn--primary';
                    btn.style.padding = '4px 10px';
                    btn.style.fontSize = '12px';
                    btn.style.flexShrink = '0';
                    btn.textContent = 'Liberar acesso';
                    btn.addEventListener('click', function () {
                        btn.disabled = true;
                        AppAuth.chamarApi('verificarEmailManualmente', { uid: uid })
                            .then(function () {
                                return AppAuth.db.collection('pedidosVerificacao').doc(uid).update({ atendido: true });
                            })
                            .then(function () {
                                showToast('Acesso liberado! A pessoa já pode entrar no app.');
                            })
                            .catch(function (err) {
                                console.error(err);
                                showToast(err.message || 'Erro ao liberar o acesso.');
                                btn.disabled = false;
                            });
                    });
                    linha.appendChild(btn);
                    ajudaLista.appendChild(linha);
                });
            }

            // Pede permissão pra poder avisar o admin com uma notificação do
            // navegador quando chegar um pedido novo (opcional, sem push server).
            if (window.Notification && Notification.permission === 'default') {
                Notification.requestPermission();
            }

            function excluirUsuario(uid) {
                AppAuth.chamarApi('excluirUsuario', { uid: uid })
                    .then(function () {
                        showToast('Conta excluída com sucesso!');
                    })
                    .catch(function (err) {
                        console.error(err);
                        showToast(err.message || 'Erro ao excluir a conta.');
                    });
            }

            AppAuth.exigirAdmin(function (perfil) {
                meUid = perfil.uid;
                document.getElementById('user-name-label').textContent = perfil.name;
                overlay.style.display = 'none';
                container.style.display = '';

                AppAuth.db.collection('pedidosVerificacao').where('atendido', '==', false)
                    .orderBy('criadoEm', 'desc').onSnapshot(renderAjuda, function (err) {
                        console.error('Erro ao observar pedidos de ajuda:', err);
                    });

                AppAuth.db.collection('users').orderBy('createdAt', 'desc').onSnapshot(
                    renderUsuarios,
                    function (err) {
                        console.error(err);
                        errorBox.textContent = 'Não foi possível carregar a lista de usuários.';
                        errorBox.classList.add('is-visible');
                    }
                );
            });

            document.getElementById('btn-logout').addEventListener('click', function () {
                AppAuth.logout().then(function () { window.location.href = 'login.html'; });
            });
        })();
    </script>
</body>

</html>
